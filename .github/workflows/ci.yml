name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Android project lives in the SetEdit-master/ subdirectory of this repository, so every
# Gradle step runs there.
defaults:
  run:
    working-directory: SetEdit-master

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image already ships the Android SDK (ANDROID_HOME is set). The
      # android-actions/setup-android action is not used because it now tries to install the
      # retired "tools" package and fails. Accept licenses so AGP can use the SDK.
      - name: Accept the Android SDK licenses
        run: |
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper fetches the NDK itself once the SDK is present, so no extra step is needed.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (warnings do not fail the build)
        run: ./gradlew lintDebug || true

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SetEdit-debug
          path: SetEdit-master/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
